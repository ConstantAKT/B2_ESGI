name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # next build ne se connecte pas à la base (client Postgres créé à la demande),
      # mais drizzle-kit et next.config exigent que la variable existe.
      DATABASE_URL: postgres://user:password@localhost:5432/dbname
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
